error.shared.invalid-page=A page is counted from 0 and holds from 1 to {2} items, got page {0} of size {1}.
error.shared.unsortable-column=This list cannot be sorted by {0}, only by {1}.
error.shared.invalid-sort-direction=A sort direction is asc or desc, got {0}.

