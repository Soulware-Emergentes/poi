# Messages the REST layer resolves against the caller's locale.
#
# Keys under "error." are derived from the domain exception types that report them, as
# error.<module>.<type name in kebab case, without the Exception suffix>. MessageBundleTest checks
# that every concrete DomainException subclass has an entry here, and that every locale bundle
# carries the same keys as this one. Renaming an exception class renames its key, and the build
# fails until this file follows.

error.shared.unauthenticated=Authentication is required to perform this action.
error.shared.not-acting-in-any-role=Act as a planner or an analyst to do this.
error.shared.not-acting-as-role=Act as {0} to do this.
error.shared.unrecognized-role=The role {0} is not one poi defines.

# Keys under "error.shared" that no exception type derives. Both are constants, the first on
# InfrastructureException and the second on InfrastructureExceptionHandler, because a technical
# failure reports one wording whatever raised it.
error.shared.infrastructure=The service is temporarily unavailable. Please try again later.
error.shared.unexpected=The request could not be completed.
