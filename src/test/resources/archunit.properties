# ArchUnit fails a rule whose selector matches no classes, on the grounds that a rule checking
# nothing is usually a rule whose target got renamed. The rules here are conditional (if a class is
# a query service, it is read-only), so they hold over an empty selection, and a template ships the
# shared kernel and no modules of its own. Left on, a fresh clone would fail its own build for
# complying trivially.
archRule.failOnEmptyShould=false
